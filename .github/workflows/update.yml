name: Update results

on:
  schedule:
    - cron: "*/5 * * * *"   # перезапускает цепочку (GitHub всё равно троттлит расписание)
  workflow_dispatch:          # можно запускать вручную из вкладки Actions

permissions:
  contents: write

# Один активный поллер + максимум один в очереди. Когда текущий заканчивается,
# сразу стартует следующий (созданный расписанием) — получается почти непрерывное обновление.
concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Poll & commit (~5 часов, опрос каждые 2 минуты)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          git config user.name "wc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 18000))   # ~5 часов, укладываемся в timeout-minutes
          while [ $SECONDS -lt $END ]; do
            # каждый тик стартуем с чистого последнего origin/main — так git-состояние
            # не может «залипнуть» на конфликте ребейза, а push всегда fast-forward
            git fetch origin main -q && git reset --hard origin/main -q
            python update_results.py || echo "fetch failed, retry next tick"
            if git diff --quiet -- results.json; then
              echo "без изменений"
            else
              git add results.json
              git commit -m "Авто-обновление результатов" -q
              git push origin HEAD:main || echo "push failed (гонка), само починится на следующем тике"
            fi
            sleep 120
          done
